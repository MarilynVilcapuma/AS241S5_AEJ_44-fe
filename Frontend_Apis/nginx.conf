server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/detection to detector service (port 8082)
    location /api/detection {
        proxy_pass http://backend-detector:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy remaining /api calls to main service (port 8084)
    location /api/ {
        proxy_pass http://backend-main:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: serve index.html for all unknown routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
